      <text x="145" y="65" fill="#a7f8ce" text-anchor="middle" font-size="12" letter-spacing="2" font-weight="700">OPEN SOURCE</text>
      <text x="71" y="153" fill="#f7fcff" font-size="84" font-weight="850" letter-spacing="-4">Guia<tspan fill="url(#glow)">IA</tspan></text>
      <path d="M76 177h445" stroke="url(#glow)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <text x="75" y="223" fill="#e5f9f4" font-size="28" font-weight="650" letter-spacing="-.5">Your world. An AI by your side.</text>
      <text x="76" y="259" fill="#aacbd2" font-size="17">Play together. Explore smarter. Build what’s next.</text>
      <text x="77" y="320" fill="#83d7bc" font-size="13" letter-spacing="2" font-weight="650">MINECRAFT JAVA  /  MCP  /  FABRIC</text>
