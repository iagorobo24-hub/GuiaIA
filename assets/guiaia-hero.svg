<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GuiaIA — Minecraft, meet your AI teammate</title>
  <desc id="desc">Original vector artwork showing a glowing AI companion above a voxel landscape at dusk. GuiaIA is an open source project in development.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d35"/>
      <stop offset=".53" stop-color="#142e41"/>
      <stop offset="1" stop-color="#0e1e29"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9afce1"/>
      <stop offset="1" stop-color="#54d2f9"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64e3ae"/>
      <stop offset="1" stop-color="#19866d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30badb"/>
      <stop offset="1" stop-color="#197e9f"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="bounds"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
