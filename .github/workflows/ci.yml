name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install .
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src
      - name: Verify source dist contents contain no private runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = {'.env', 'server.properties', 'rcon.secret'}
          paths = [x for x in Path('.').rglob('*') if x.is_file() and '.git' not in x.parts]
          assert not any(x.name in forbidden for x in paths)
          assert not any(x.suffix.lower() in {'.mca', '.nbt', '.sqlite', '.sqlite3'} for x in paths)
          PY
