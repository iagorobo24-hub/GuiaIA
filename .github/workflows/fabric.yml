name: Fabric Observer Build (isolated)

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'fabric-observer/**'
      - '.github/workflows/fabric.yml'
  pull_request:
    paths:
      - 'fabric-observer/**'
      - '.github/workflows/fabric.yml'

permissions:
  contents: read

jobs:
  compile-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated Fabric mod
        working-directory: fabric-observer
        run: gradle --no-daemon build
      - name: Archive mod for inspection (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: guiaia-observer-build-qa
          path: fabric-observer/build/libs/*.jar
          retention-days: 3
