name: Fabric Observer Build (isolated)

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'fabric-observer/**'
      - 'scripts/qa_fabric_server.py'
      - 'scripts/qa_observer_stress.py'
      - 'scripts/qa_companion_server.py'
      - 'scripts/qa_gather_server.py'
      - 'scripts/qa_mission_server.py'
      - 'scripts/qa_multiresource_server.py'
      - 'scripts/qa_chest_server.py'
      - 'companion/**'
      - '.github/workflows/fabric.yml'
  pull_request:
    paths:
      - 'fabric-observer/**'
      - 'scripts/qa_fabric_server.py'
      - 'scripts/qa_observer_stress.py'
      - 'scripts/qa_companion_server.py'
      - 'scripts/qa_gather_server.py'
      - 'scripts/qa_mission_server.py'
      - 'scripts/qa_multiresource_server.py'
      - 'scripts/qa_chest_server.py'
      - 'companion/**'
      - '.github/workflows/fabric.yml'

permissions:
  contents: read

jobs:
  compile-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated Fabric mod
        working-directory: fabric-observer
        run: gradle --no-daemon build
      - name: Download official pinned Fabric QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guiaia-qa"
          curl --fail --location --retry 3 --silent --show-error \
            "https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.19.5/1.1.2/server/jar" \
            --output "$RUNNER_TEMP/guiaia-qa/launcher.jar"
          curl --fail --location --retry 3 --silent --show-error \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.17+1.21.1/fabric-api-0.116.17+1.21.1.jar" \
            --output "$RUNNER_TEMP/guiaia-qa/fabric-api.jar"
          test -s "$RUNNER_TEMP/guiaia-qa/launcher.jar"
          test -s "$RUNNER_TEMP/guiaia-qa/fabric-api.jar"
      - name: Exercise real Minecraft QA world (loopback only)
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          mod="$(find fabric-observer/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$mod"
          python3 scripts/qa_fabric_server.py \
            --launcher "$RUNNER_TEMP/guiaia-qa/launcher.jar" \
            --fabric-api "$RUNNER_TEMP/guiaia-qa/fabric-api.jar" \
            --mod "$mod"
      - name: Bounded entity stress — control vs observer
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          mod="$(find fabric-observer/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          python3 scripts/qa_observer_stress.py \
            --launcher "$RUNNER_TEMP/guiaia-qa/launcher.jar" \
            --fabric-api "$RUNNER_TEMP/guiaia-qa/fabric-api.jar" \
            --mod "$mod"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install pinned local QA companion dependencies
        working-directory: companion
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real QA bot login / follow / stop
        env:
          PYTHONPATH: src
        shell: bash
        run: python3 scripts/qa_companion_server.py --launcher "$RUNNER_TEMP/guiaia-qa/launcher.jar"
      - name: Verify single oak log gathered and inventoried in real Minecraft QA
        env:
          PYTHONPATH: src
        shell: bash
        run: python3 scripts/qa_gather_server.py --launcher "$RUNNER_TEMP/guiaia-qa/launcher.jar"
      - name: Durable two-step Minecraft mission and restart without replay
        env:
          PYTHONPATH: src
        shell: bash
        run: python3 scripts/qa_mission_server.py --launcher "$RUNNER_TEMP/guiaia-qa/launcher.jar"
      - name: Two distinct resources, bounded navigation and durable receipts
        env:
          PYTHONPATH: src
        shell: bash
        run: python3 scripts/qa_multiresource_server.py --launcher "$RUNNER_TEMP/guiaia-qa/launcher.jar"
      - name: Verify real chest transfers and two-sided inventory receipts (QA only)
        env:
          PYTHONPATH: src
        shell: bash
        run: python3 scripts/qa_chest_server.py --launcher "$RUNNER_TEMP/guiaia-qa/launcher.jar"
      - name: Archive mod for inspection (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: guiaia-observer-build-qa
          path: fabric-observer/build/libs/*.jar
          retention-days: 3
